<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inscription</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f2f4f8; display: flex; justify-content: center; padding-top: 80px; }
        .card { background: #fff; padding: 30px 40px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.1); width: 320px; }
        input { width: 100%; padding: 8px; margin: 6px 0 14px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #27ae60; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
        .error { color: #c0392b; }
    </style>
</head>
<body>
<div class="card">
    <h2>Créer un compte</h2>
    <p class="error" th:if="${error}" th:text="${error}"></p>
    <form th:action="@{/register}" method="post">
        <label>Nom d'utilisateur</label>
        <input type="text" name="username" required>
        <label>Mot de passe</label>
        <input type="password" name="password" required>
        <button type="submit">S'inscrire</button>
    </form>
    <p><a th:href="@{/login}">Retour à la connexion</a></p>
</div>
</body>
</html>
