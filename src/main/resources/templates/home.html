<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Accueil</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        a { margin-right: 15px; }
    </style>
</head>
<body>
<h1>Bienvenue, <span sec:authentication="name">utilisateur</span></h1>
<p>Rôles : <span sec:authentication="principal.authorities">[]</span></p>

<nav>
    <a th:href="@{/user/dashboard}">Espace utilisateur</a>
    <a th:href="@{/admin/dashboard}" sec:authorize="hasRole('ADMIN')">Espace administrateur</a>
</nav>

<form th:action="@{/logout}" method="post" style="margin-top:20px">
    <button type="submit">Se déconnecter</button>
</form>
</body>
</html>
